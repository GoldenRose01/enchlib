name: Publish Horizon 26.3 preview
on:
  push:
    branches: [horizon-26.3]
    paths: ['horizon/**', '.github/workflows/horizon-preview.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Horizon's mod tool
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 install --locked --git https://github.com/horizon-rust/horizon --rev f1bb66f353cf67f2aa4665293fc75c8d91186fc7 cargo-horizon-mod
      - name: Build and check the mod
        working-directory: horizon
        run: |
          cargo horizon-mod build --wasm
          cargo horizon-mod check target/horizon-mod/enchlib.hmod
      - name: Publish the prerelease
        working-directory: horizon
        run: |
          gh release create horizon-26.3-v1.8.1-alpha.1 target/horizon-mod/enchlib.hmod --target "$GITHUB_SHA" --title "EnchLib 1.8.1-alpha.1 for Horizon 26.3" --notes-file README.md --prerelease --latest=false
